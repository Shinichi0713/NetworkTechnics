[package]
name = "physics-sim-optimized"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland"] }
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"