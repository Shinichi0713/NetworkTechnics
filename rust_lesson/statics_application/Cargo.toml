[package]
name = "u-statistics-advanced"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
rand = { version = "0.8", features = ["small_rng"] }

[profile.release]
opt-level = 3
lto = true
